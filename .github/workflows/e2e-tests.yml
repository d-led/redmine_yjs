name: E2E Tests - Collaborative Editing

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.ts'
      - '**/*.js'
      - '**/*.rb'
      - '**/*.erb'
      - '**/*.css'
      - 'test/e2e/**'
      - 'hocuspocus/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run with debug logging'
        required: false
        default: 'false'
        type: boolean
      full:
        description: 'Run full test matrix (all Redmine/Ruby versions)'
        required: false
        default: 'false'
        type: boolean

env:
  HOST: '127.0.0.1'

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event.inputs.full }}" == "true" ]; then
            echo 'matrix={"include":[{"redmine_tag":"6.1","ruby_version":"3.1"},{"redmine_tag":"6.0","ruby_version":"3.0"},{"redmine_tag":"5.1","ruby_version":"2.7"},{"redmine_tag":"5.0","ruby_version":"2.7"}]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"include":[{"redmine_tag":"6.0","ruby_version":"3.0"}]}' >> $GITHUB_OUTPUT
          fi

  e2e-tests:
    name: E2E Tests - Redmine ${{ matrix.redmine_tag }} (Ruby ${{ matrix.ruby_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: setup-matrix
    
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Cache npm dependencies (plugin)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-plugin-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-plugin-

      - name: Install plugin dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run unit tests
        run: npm test

      - name: Run Hocuspocus server tests
        working-directory: hocuspocus
        run: |
          npm ci
          npm test

      - name: Cache npm dependencies (e2e)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-e2e-${{ hashFiles('test/e2e/package-lock.json', 'test/e2e/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-e2e-

      - name: Install test dependencies
        working-directory: test/e2e
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright browsers
        working-directory: test/e2e
        run: npx playwright install chromium --with-deps

      - name: Start Docker services
        env:
          REDMINE_TAG: ${{ matrix.redmine_tag }}
        run: |
          chmod +x scripts/start_test_services.sh
          ./scripts/start_test_services.sh

      - name: Run E2E tests
        env:
          SUT_BASE_URL: 'http://127.0.0.1:3000'
          HOCUSPOCUS_URL: 'http://127.0.0.1:8081'
          HOCUSPOCUS_WS_URL: 'ws://127.0.0.1:8081'
          HEADLESS: 'true'
          DEBUG: ${{ github.event.inputs.debug || 'false' }}
        run: |
          ./scripts/run_all_tests.sh --e2e-only

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-report-redmine${{ matrix.redmine_tag }}-ruby${{ matrix.ruby_version }}
          path: test/e2e/reports/
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-screenshots-redmine${{ matrix.redmine_tag }}-ruby${{ matrix.ruby_version }}
          path: test/e2e/reports/screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Show Docker logs on failure
        if: failure()
        working-directory: test/e2e
        run: |
          echo "=== Redmine logs ==="
          docker compose logs --tail=100 redmine || true
          echo ""
          echo "=== Hocuspocus logs ==="
          docker compose logs --tail=100 hocuspocus || true

      - name: Stop Docker services
        if: always()
        run: |
          chmod +x scripts/stop_test_services.sh
          ./scripts/stop_test_services.sh || true
